# Discovery runs on "queries" and pushes discovered video URLs into the Google Sheet as PENDING.
# NOTE:
# - youtube uses yt-dlp ytsearch (no API key).
# - vimeo/dailymotion use Playwright scraping of their own search pages.
# - other platforms are included as toggles and will work once their providers are implemented.

limits:
  # Cap URLs enqueued per query across all platforms combined
  per_query_max_urls: 50

  # Optional: stop whole run after this many URLs enqueued (0 = unlimited)
  global_max_urls: 0

  # If true, skip enqueueing URLs already present in the sheet
  dedupe_against_sheet: true

  # Fail-open behaviour: continue even if one platform provider errors
  continue_on_provider_error: true

platform_search:
  youtube:
    enabled: true
    search_engine_name: "YouTubeSearch"
    max_results_per_query: 30
    # If you want to bias longer training, set min_duration filter later (metadata stage)

  vimeo:
    enabled: true
    search_engine_name: "VimeoSearch"
    max_pages: 2

  dailymotion:
    enabled: true
    search_engine_name: "DailymotionSearch"
    max_pages: 2

  # The following are placeholders for future providers
  facebook_watch:
    enabled: false
    search_engine_name: "FacebookSearch"
    max_pages: 1

  instagram:
    enabled: false
    search_engine_name: "InstagramSearch"
    max_pages: 1

  tiktok:
