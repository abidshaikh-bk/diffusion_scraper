filtering:
  min_duration_sec: 1      # 2 minutes
  max_duration_sec: 1800     # 30 minutes
downloads:
  base_dir: "data/downloads"
runtime:
  # Worker behavior (these mirror your .env but can be centralized later)
  poll_interval_sec: 3
  batch_size: 8
  concurrency: 2

limits:
  # Add small jitter delays between downloads per worker (we can implement next)
  min_delay_sec: 3
  max_delay_sec: 8