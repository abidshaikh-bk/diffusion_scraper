include_keywords:
  # High-signal training intent
  - training
  - tutorial
  - course
  - workshop
  - practical
  - hands-on
  - demonstration
  - demo
  - step by step
  - how to
  - protocol
  - procedure
  - skills
  - competency
  - simulation
  - scenario
  - drill

  # First aid / emergency response
  - first aid
  - cpr
  - cardiopulmonary resuscitation
  - bls
  - basic life support
  - acls
  - advanced cardiovascular life support
  - pals
  - pediatric advanced life support
  - choking
  - heimlich
  - rescue breathing
  - recovery position
  - airway management
  - bag valve mask
  - bvm
  - oxygen therapy
  - bleeding control
  - hemorrhage control
  - tourniquet
  - wound care
  - bandaging
  - splinting
  - fracture management
  - burn care
  - burns first aid
  - shock management
  - anaphylaxis
  - epipen
  - seizure first aid
  - stroke recognition
  - FAST stroke
  - heart attack
  - myocardial infarction
  - triage
  - emergency response
  - disaster response
  - mass casualty
  - mci

  # Clinical / nursing / EMT skills (high-signal)
  - vital signs
  - blood pressure measurement
  - pulse oximetry
  - spO2
  - temperature measurement
  - patient assessment
  - primary survey
  - secondary survey
  - nursing skills
  - emt training
  - paramedic training
  - iv cannulation
  - venipuncture
  - phlebotomy
  - injection technique
  - intramuscular injection
  - subcutaneous injection
  - insulin injection
  - catheterization
  - urinary catheter
  - ng tube
  - nasogastric tube
  - suctioning
  - wound dressing
  - sterile dressing
  - aseptic technique
  - sterile technique
  - hand hygiene
  - ppe donning
  - ppe doffing
  - infection control
  - isolation precautions
  - cdc guidelines
  - patient transfer
  - safe lifting
  - back safety
  - ergonomics

  # Workplace / safety training that overlaps medical
  - workplace safety
  - occupational safety
  - hse training
  - safety induction
  - incident response
  - emergency preparedness
  - evacuation drill
  - fire safety
  - basic fire fighting
  - hazard communication
  - risk assessment
  - safe work practices
  - chemical safety
  - msds
  - sds
  - biohazard
  - sharps safety
  - needle stick injury
