exclude_keywords:
  # Entertainment / irrelevant
  - trailer
  - teaser
  - promo
  - advertisement
  - commercial
  - highlights
  - compilation
  - funny
  - prank
  - meme
  - reaction
  - music video
  - remix
  - lyrics
  - dance
  - episode
  - full episode
  - gameplay

  # News / commentary (usually not training)
  - news
  - interview
  - debate
  - documentary

  # Potentially sensitive/graphic without training context (optional strictness)
  - gore
  - graphic
  - autopsy
  - surgery live
  - cadaver

include_logic:
  # If true: require at least one include keyword match
  require_any_include: true

matching:
  # Where to search keywords
  use_title: true
  use_description: true

scoring:
  # Optional: minimum number of include hits required (set 1 to be permissive)
  min_include_hits: 1